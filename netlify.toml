[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Case study pages are served without ".html"
[[redirects]]
  from = "/work/anthonys-little-harbour"
  to = "/work/anthonys-little-harbour.html"
  status = 200

[[redirects]]
  from = "/work/zen-visuals"
  to = "/work/zen-visuals.html"
  status = 200

[[redirects]]
  from = "/work/jolly-felties"
  to = "/work/jolly-felties.html"
  status = 200

[[redirects]]
  from = "/work/derwent-fire-compliance"
  to = "/work/derwent-fire-compliance.html"
  status = 200

[[redirects]]
  from = "/work/one-to-one"
  to = "/work/one-to-one.html"
  status = 200

[[redirects]]
  from = "/offer"
  to = "/offer.html"
  status = 200
