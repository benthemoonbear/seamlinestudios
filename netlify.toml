[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Case study pages are served without ".html"
[[redirects]]
  from = "/work/anthonys-little-harbour"
  to = "/work/anthonys-little-harbour.html"
  status = 200
